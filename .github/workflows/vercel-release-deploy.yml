name: Vercel Release Deploy

on:
  workflow_call:
    inputs:
      ref:
        description: Git tag to deploy — from the release event (github.event.release.tag_name) or an explicit tag for rollback
        type: string
        required: true
      working-directory:
        description: Directory containing the Vercel project
        type: string
        default: "."
      node-version:
        type: string
        default: "24"
      install-command:
        type: string
        default: "pnpm install --frozen-lockfile"
      deploy-args:
        type: string
        default: ""
      github-environment:
        description: GitHub environment for the production deploy job
        type: string
        default: production
      production-url:
        description: Fixed production URL to show in the job summary (e.g. a custom domain)
        type: string
        default: ""
    secrets:
      VERCEL_TOKEN:
        required: true
      VERCEL_ORG_ID:
        required: false
      VERCEL_PROJECT_ID:
        required: false
      HEROUI_AUTH_TOKEN:
        required: false
    outputs:
      deployment-url:
        value: ${{ jobs.deploy.outputs.deployment-url }}

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    uses: ./.github/workflows/vercel-deploy.yml
    secrets: inherit
    with:
      environment: production
      ref: ${{ inputs.ref }}
      working-directory: ${{ inputs.working-directory }}
      node-version: ${{ inputs.node-version }}
      install-command: ${{ inputs.install-command }}
      deploy-args: ${{ inputs.deploy-args }}
      github-environment: ${{ inputs.github-environment }}
      production-url: ${{ inputs.production-url }}
