# Copy to .github/workflows/deploy-<app>.yml in a monorepo app repo
#
# NOTE: each Vercel project in the monorepo needs its OWN caller workflow
# (or a matrix job), because VERCEL_PROJECT_ID differs per app. This file
# deploys a single app at apps/web — duplicate it per app, swapping
# working-directory and the VERCEL_PROJECT_ID secret source.
#
# Prerequisites:
#   - Vercel Git integration DISABLED for the project (Settings > Git > disconnect,
#     or set the Ignored Build Step to `exit 0`) — otherwise every push deploys twice
#   - Org secrets: VERCEL_TOKEN, VERCEL_ORG_ID
#   - Repo secret:  VERCEL_PROJECT_ID (per app, e.g. VERCEL_PROJECT_ID_WEB)
#   - All build-time env vars set in the Vercel project (Preview + Production)

name: Deploy web

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Tag to deploy (leave empty for the latest release)
        type: string
        required: false

concurrency:
  group: deploy-web-${{ github.event_name == 'workflow_dispatch' && 'production' || 'preview' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  preview:
    if: github.event_name == 'push'
    uses: stowlog/meta/.github/workflows/vercel-deploy.yml@main
    secrets: inherit
    with:
      environment: preview
      working-directory: apps/web

  production:
    if: github.event_name == 'workflow_dispatch'
    uses: stowlog/meta/.github/workflows/vercel-release-deploy.yml@main
    secrets: inherit
    with:
      ref: ${{ inputs.ref }}
      working-directory: apps/web
      # release-mode: latest-tag   # default; use 'head' to skip release gating
