# Copy to .github/workflows/deploy.yml in a Vercel app repo. Also copy
# release-standard-caller.yml to .github/workflows/release.yml — this file no longer
# runs release-please itself, it only deploys when a GitHub Release is published.
#
# Prerequisites:
#   - Vercel Git integration DISABLED for the project (Settings > Git > disconnect,
#     or set the Ignored Build Step to `exit 0`) — otherwise every push deploys twice
#   - Org secrets: VERCEL_TOKEN, VERCEL_ORG_ID
#   - Repo secret:  VERCEL_PROJECT_ID
#   - All build-time env vars set in the Vercel project (Preview + Production)

name: Deploy

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Existing tag to redeploy (rollback only)
        type: string
        required: true

concurrency:
  group: deploy-${{ github.event_name == 'push' && 'preview' || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  preview:
    if: github.event_name == 'push'
    uses: stowlog/meta/.github/workflows/vercel-deploy.yml@main
    secrets: inherit
    with:
      environment: preview

  production:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    uses: stowlog/meta/.github/workflows/vercel-release-deploy.yml@main
    secrets: inherit
    with:
      ref: ${{ github.event.release.tag_name || inputs.ref }}
